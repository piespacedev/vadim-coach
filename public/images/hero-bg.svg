<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14181A"/>
      <stop offset="55%" stop-color="#0B0E10"/>
      <stop offset="100%" stop-color="#050708"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.74" cy="0.18" r="0.6">
      <stop offset="0%" stop-color="#3E7A5E" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#22443A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.12" cy="0.88" r="0.65">
      <stop offset="0%" stop-color="#1E4664" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.45" cy="0.55" r="0.45">
      <stop offset="0%" stop-color="#8A6A35" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </linearGradient>
    <pattern id="lines" width="120" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <rect width="120" height="120" fill="none"/>
      <rect x="0" y="0" width="1" height="120" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#glowA)"/>
  <rect width="1600" height="1000" fill="url(#glowB)"/>
  <rect width="1600" height="1000" fill="url(#glowC)"/>
  <rect width="1600" height="1000" fill="url(#lines)"/>
  <g opacity="0.18" stroke="#ffffff" fill="none" stroke-width="1.2">
    <circle cx="1180" cy="300" r="260"/>
    <circle cx="1180" cy="300" r="420"/>
    <circle cx="1180" cy="300" r="580"/>
  </g>
  <rect width="1600" height="1000" fill="url(#vignette)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.06"/>
</svg>
