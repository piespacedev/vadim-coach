# Бот заявок Вадима Лойко: nginx принимает HTTPS и передаёт заявки с формы сайта
# Node-сервису на 127.0.0.1:3300. Больше ничего наружу не отдаётся.
# Ставится в /etc/nginx/sites-available/vadim-bot.
# Сертификат: certbot certonly --webroot -w /var/www/html -d vadim-bot.201-34-132-115.sslip.io

# Не больше 5 заявок в минуту с одного адреса — от спама.
limit_req_zone $binary_remote_addr zone=vadim_lead:1m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name vadim-bot.201-34-132-115.sslip.io;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vadim-bot.201-34-132-115.sslip.io;

    ssl_certificate /etc/letsencrypt/live/vadim-bot.201-34-132-115.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vadim-bot.201-34-132-115.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /api/lead {
        limit_req zone=vadim_lead burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / { return 404; }
}
